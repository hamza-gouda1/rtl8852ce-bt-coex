<title id="t">Bluetooth channel map before and after bt-afh-guard</title>
<desc id="d">v0.1: the AFH map was empty in 121 of 121 samples, so Bluetooth hopped across all 79 channels, including the Wi-Fi channel. v1.0: bt-afh-guard sets the map to channels 0-23 and 77-78 only.</desc>
<rect width="812" height="250" rx="10" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#1f2328">Where Bluetooth is allowed to hop (79 channels, 2402–2480 MHz)</text>
<text x="20" y="50" font-size="12" fill="#59636e">Router on Wi-Fi channel 11, 40 MHz. Each cell is one 1 MHz Bluetooth channel.</text>
